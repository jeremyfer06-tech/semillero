<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso de equipo — Semillero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --panel:#FFFFFF; --line:#E4E2D8; --ink:#16241B; --muted:#6B7268;
    --maroon:#D94E1F; --maroon-50:#FCEAE2; --sol:#F5B700; --sol-50:#FDF3D9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',sans-serif;line-height:1.5;
       min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .box{width:100%;max-width:380px;padding:0 20px;}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:6px;text-decoration:none;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px;}
  .brand em{font-style:normal;color:var(--maroon);}
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:28px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;margin-bottom:16px;font-family:'Public Sans',sans-serif;}
  button{width:100%;background:var(--maroon);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .error{background:var(--maroon-50);color:var(--maroon);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;}
  .back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;text-decoration:none;}
  .back:hover{color:var(--maroon);}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect x='20' y='20' width='80' height='80' rx='10' fill='none' stroke='%231B7A43' stroke-width='9' transform='rotate(45 60 60)'/><path d='M60 78 L60 54' stroke='%231B7A43' stroke-width='7' fill='none' stroke-linecap='round'/><path d='M60 62 C50 58 46 48 50 40 C58 44 62 54 60 62 Z' fill='%23F5B700'/><path d='M60 58 C70 52 74 42 70 34 C62 40 57 50 60 58 Z' fill='%23D94E1F'/><circle cx='60' cy='78' r='6' fill='%231B7A43'/></svg>">
</head>
<body>
  <div class="box">
    <a href="{% url 'inicio' %}" class="brand"><svg width="22" height="22" viewBox="0 0 120 120" style="flex-shrink:0;">
        <rect x="20" y="20" width="80" height="80" rx="10" fill="none" stroke="#1B7A43" stroke-width="9" transform="rotate(45 60 60)"/>
        <path d="M60 78 L60 54" stroke="#1B7A43" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M60 62 C50 58 46 48 50 40 C58 44 62 54 60 62 Z" fill="#F5B700"/>
        <path d="M60 58 C70 52 74 42 70 34 C62 40 57 50 60 58 Z" fill="#D94E1F"/>
        <circle cx="60" cy="78" r="6" fill="#1B7A43"/>
      </svg>Semillero</a>
    <div class="sub">Acceso para administradores de equipo</div>
    <div class="card">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autofocus>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password">
        <button type="submit">Entrar</button>
      </form>
    </div>
    <a href="{% url 'inicio' %}" class="back">&larr; Volver al inicio</a>
  </div>
</body>
</html>
