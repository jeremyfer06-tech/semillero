<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B7A43">
<title>Sin conexión — Semillero</title>
<style>
  :root{--bg:#FAFAF7;--ink:#16241B;--muted:#6B7268;--grass:#1B7A43;--maroon:#D94E1F;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;line-height:1.5;padding:24px;}
  .box{max-width:380px;text-align:center;}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:26px;margin:22px 0 10px;}
  p{color:var(--muted);font-size:15px;margin:0 0 26px;}
  .btn{display:inline-block;background:var(--maroon);color:#fff;border:none;border-radius:9px;
    padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;}
  .back{display:block;margin-top:16px;color:var(--grass);font-size:14px;text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <svg width="72" height="72" viewBox="0 0 120 120" aria-hidden="true">
      <rect x="20" y="20" width="80" height="80" rx="10" fill="none" stroke="#1B7A43" stroke-width="9" transform="rotate(45 60 60)"/>
      <path d="M60 78 L60 54" stroke="#1B7A43" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M60 62 C50 58 46 48 50 40 C58 44 62 54 60 62 Z" fill="#F5B700"/>
      <path d="M60 58 C70 52 74 42 70 34 C62 40 57 50 60 58 Z" fill="#D94E1F"/>
      <circle cx="60" cy="78" r="6" fill="#1B7A43"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página. Revisa tu conexión a internet y vuelve a intentarlo.</p>
    <button class="btn" type="button" onclick="location.reload()">Reintentar</button>
    <a class="back" href="/">Ir al inicio</a>
  </div>
</body>
</html>
